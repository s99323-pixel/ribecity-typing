if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    const rad=typeof r==='number'?r:(Array.isArray(r)?r[0]:0)||0;
    this.moveTo(x+rad,y);
    this.lineTo(x+w-rad,y);this.arcTo(x+w,y,x+w,y+rad,rad);
    this.lineTo(x+w,y+h-rad);this.arcTo(x+w,y+h,x+w-rad,y+h,rad);
    this.lineTo(x+rad,y+h);this.arcTo(x,y+h,x,y+h-rad,rad);
    this.lineTo(x,y+rad);this.arcTo(x,y,x+rad,y,rad);
    this.closePath();return this;
  };
}

const AC=new (window.AudioContext||window.webkitAudioContext)();
const masterGain=AC.createGain();masterGain.gain.value=0.9;masterGain.connect(AC.destination);
const sfxGain=AC.createGain();sfxGain.gain.value=0.7;sfxGain.connect(masterGain);

function osc(f,d,type='sine',v=0.3,delay=0,sweep=null,dest=sfxGain){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(dest);o.type=type;
  const t=AC.currentTime+delay;
  if(sweep){o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(sweep,t+d);}
  else o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.setValueAtTime(v,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.start(t);o.stop(t+d+0.02);
}
function nz(d,v=0.15,lp=600){
  const buf=AC.createBuffer(1,~~(AC.sampleRate*d),AC.sampleRate);
  const dt=buf.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  f.type='bandpass';f.frequency.value=lp;f.Q.value=1;
  s.buffer=buf;s.connect(f);f.connect(g);g.connect(sfxGain);
  g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  s.start();s.stop(AC.currentTime+d+0.02);
}

    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='ja-JP';
      u.rate=opts.rate||1.05;
      u.pitch=opts.pitch||0.85;
      u.volume=opts.volume||0.9;
      // 日本語ボイス優先選択
      const voices=window.speechSynthesis.getVoices();
      const jp=voices.find(v=>/ja[-_]JP|Japanese/i.test(v.lang+v.name));
      if(jp)u.voice=jp;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  },
  // SF2リスペクト「うーお！」KO叫び（自前合成・著作権セーフ）
  koCry:(idx)=>{
    const basePitch=145-idx*12; // 145, 133, 121 Hz
    const dur=0.55;
    const t=AC.currentTime;
    // 基音（声帯模擬：sineに微弱vibrato）
    const o1=AC.createOscillator();o1.type='sawtooth';
    o1.frequency.setValueAtTime(basePitch,t);
    o1.frequency.linearRampToValueAtTime(basePitch*0.82,t+dur*0.7);
    o1.frequency.linearRampToValueAtTime(basePitch*0.55,t+dur);
    const g1=AC.createGain();
    g1.gain.setValueAtTime(0.001,t);
    g1.gain.exponentialRampToValueAtTime(0.55,t+0.05);
    g1.gain.exponentialRampToValueAtTime(0.001,t+dur);
    // 第1フォルマント（う→お）
    const fil1=AC.createBiquadFilter();
    fil1.type='bandpass';
    fil1.frequency.setValueAtTime(330,t);
    fil1.frequency.linearRampToValueAtTime(500,t+dur);
    fil1.Q.value=10;
    // 第2フォルマント
    const fil2=AC.createBiquadFilter();
    fil2.type='bandpass';
    fil2.frequency.setValueAtTime(870,t);
    fil2.frequency.linearRampToValueAtTime(880,t+dur);
    fil2.Q.value=14;
    o1.connect(fil1);fil1.connect(fil2);fil2.connect(g1);g1.connect(sfxGain);
    o1.start(t);o1.stop(t+dur);
  },
};

function unlockAchievement(id){
  const hs=loadHS();const list=hs.achievements||[];
  if(list.includes(id))return;
  list.push(id);hs.achievements=list;localStorage.setItem(LS_KEY,JSON.stringify(hs));
  const def=ACHIEVEMENTS.find(a=>a.id===id);
  if(def)achieveQueue.push({name:def.name,desc:def.desc,timer:220});
  // バッジに紐づく実績なら、全点灯チェック＆点灯演出＆SE
  const badge=POWER_BADGES.find(b=>b.achievementId===id);
  if(badge){
    badgePulseTimer[badge.key]=90;
    centerBadgePop={key:badge.key,timer:120,maxTimer:120};
    if(typeof SFX!=='undefined'&&SFX.badgeUnlock)SFX.badgeUnlock();
    if(id!=='badgeall')checkBadgeAll();
  }
  if(id==='badgeall'&&typeof SFX!=='undefined'&&SFX.badgeAll)SFX.badgeAll();
}
// ── バッジ解除時のセンターポップアップ ──
let centerBadgePop=null;
function drawCenterBadgePop(){
  if(!centerBadgePop)return;
  centerBadgePop.timer--;
  if(centerBadgePop.timer<=0){centerBadgePop=null;return;}
  const t=centerBadgePop.timer,maxT=centerBadgePop.maxTimer;
  const age=maxT-t;
  const popIn=Math.min(1,age/10);
  const fadeOut=t<25?t/25:1;
  const badge=POWER_BADGES.find(b=>b.key===centerBadgePop.key);
  if(!badge)return;
  const scale=popIn*(1+Math.sin(age*0.18)*0.06);
  const alpha=fadeOut*0.92;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(W/2,H/2-30);
  ctx.scale(scale,scale);
  // 背景円光
  const r=80;
  const glowGrad=ctx.createRadialGradient(0,0,10,0,0,r*1.4);
  glowGrad.addColorStop(0,badge.color);
  glowGrad.addColorStop(0.5,badge.glow);
  glowGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.shadowBlur=40;ctx.shadowColor=badge.glow;
  ctx.fillStyle=glowGrad;
  ctx.beginPath();ctx.arc(0,0,r*1.4,0,Math.PI*2);ctx.fill();
  // 大バッジ
  ctx.shadowBlur=30;ctx.shadowColor=badge.glow;
  ctx.fillStyle='rgba(10,8,30,0.86)';
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=badge.color;ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=badge.color;
  ctx.shadowBlur=20;ctx.shadowColor=badge.glow;
  ctx.font='bold 86px "Hiragino Sans","Yu Gothic",monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(badge.label,0,5);
  ctx.textBaseline='alphabetic';
  // ラベルテキスト
  ctx.shadowBlur=10;
  ctx.font='bold 18px "Hiragino Sans","Yu Gothic",monospace';
  ctx.fillStyle='#fff';
  ctx.fillText('🎉 解放！',0,r+30);
  ctx.font='bold 22px "Hiragino Sans","Yu Gothic",monospace';
  ctx.fillStyle=badge.color;
  ctx.fillText(badge.name,0,r+58);
  ctx.shadowBlur=0;
  ctx.restore();
}

  lionQuote={text,timer:opts.duration||140,maxTimer:opts.duration||140,col:opts.col||'#222',bg:opts.bg||'rgba(255,255,255,0.96)'};
  if(opts.speak!==false&&typeof SFX!=='undefined'&&SFX.speak)SFX.speak(text,{rate:1.2,pitch:1.0,volume:0.7});
}
function drawLionQuote(){
  if(!lionQuote)return;
  lionQuote.timer--;
  if(lionQuote.timer<=0){lionQuote=null;return;}
  const t=lionQuote.timer,mt=lionQuote.maxTimer;
  const fadeIn=Math.min(1,(mt-t)/8);
  const fadeOut=t<22?t/22:1;
  const alpha=fadeIn*fadeOut;
  ctx.save();ctx.globalAlpha=alpha;
  const lx=178,ly=170;
  const fontSize=13;
  ctx.font=`bold ${fontSize}px "Hiragino Sans","Yu Gothic",monospace`;
  const w=Math.max(80,ctx.measureText(lionQuote.text).width+22);
  ctx.fillStyle=lionQuote.bg;
  ctx.strokeStyle='rgba(255,180,40,0.95)';ctx.lineWidth=1.8;
  ctx.shadowBlur=12;ctx.shadowColor='#FFD700';
  ctx.beginPath();ctx.roundRect(lx-w/2,ly-32,w,28,9);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(lx-6,ly-3);ctx.lineTo(lx,ly+8);ctx.lineTo(lx+6,ly-3);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle=lionQuote.col;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(lionQuote.text,lx,ly-18);
  ctx.textBaseline='alphabetic';
  ctx.restore();
}
let hurtQuoteCooldown=0;
function checkLionHurtQuote(){
  if(hurtQuoteCooldown>0){hurtQuoteCooldown--;return;}
  if(G.playerHp/G.playerMaxHp<0.30&&G.playerHp>0){
    const line=LION_HURT_LINES[Math.floor(Math.random()*LION_HURT_LINES.length)];
    showLionQuote(line,{col:'#000',bg:'rgba(255,230,180,0.96)'});
    hurtQuoteCooldown=600;
  }
}
function drawPowerBadges(x,y,size,opts){
  // x,y = 左上座標 / size = 1バッジの直径 / opts = {gap, showLabel, mini}
  opts=opts||{};
  const gap=opts.gap||(size*0.18);
  const unlocked=getUnlockedBadges();
  POWER_BADGES.forEach((b,i)=>{
    const cx=x+i*(size+gap)+size/2;
    const cy=y+size/2;
    const isOn=unlocked.includes(b.key);
    const pulse=badgePulseTimer[b.key]>0?(badgePulseTimer[b.key]/90):0;
    if(pulse>0)badgePulseTimer[b.key]--;
    ctx.save();
    // 外枠リング（グラデ）
    if(isOn){
      const ringR=size/2+1+pulse*4;
      ctx.shadowBlur=14+pulse*22;ctx.shadowColor=b.glow;
      const grad=ctx.createRadialGradient(cx,cy,size*0.2,cx,cy,ringR);
      grad.addColorStop(0,b.color);
      grad.addColorStop(0.6,b.glow);
      grad.addColorStop(1,'rgba(0,0,0,0.5)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(cx,cy,ringR,0,Math.PI*2);ctx.fill();
      // 内側の濃い円
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(10,8,30,0.78)';
      ctx.beginPath();ctx.arc(cx,cy,size/2-2,0,Math.PI*2);ctx.fill();
      // 縁取り
      ctx.strokeStyle=b.color;ctx.lineWidth=1.3;
      ctx.beginPath();ctx.arc(cx,cy,size/2-2,0,Math.PI*2);ctx.stroke();
    }else{
      ctx.fillStyle='rgba(40,40,55,0.7)';
      ctx.beginPath();ctx.arc(cx,cy,size/2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(120,120,140,0.4)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(cx,cy,size/2,0,Math.PI*2);ctx.stroke();
    }
    // 文字
    if(isOn){
      ctx.shadowBlur=10+pulse*12;ctx.shadowColor=b.glow;
      ctx.fillStyle=b.color;
    }else{
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(160,160,175,0.55)';
    }
    ctx.font=`bold ${Math.floor(size*0.55)}px "Hiragino Sans","Yu Gothic",monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.label,cx,cy+1);
    ctx.restore();
  });
  ctx.textBaseline='alphabetic';
}
function drawAchievements(){
  achieveQueue=achieveQueue.filter(a=>{
    a.timer--;const alpha=a.timer<40?a.timer/40:1;
    const y=H-160-achieveQueue.indexOf(a)*58;
    ctx.save();ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(10,8,30,0.94)';ctx.strokeStyle='#FFD700';ctx.lineWidth=1.5;
    ctx.shadowBlur=14;ctx.shadowColor='#FFD700';
    ctx.beginPath();ctx.roundRect(W-256,y,244,50,10);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle='#FFD700';ctx.font='bold 13px "Hiragino Sans","Yu Gothic",monospace';
    ctx.textAlign='left';ctx.fillText('🏆 実績解除: '+a.name,W-246,y+19);
    ctx.fillStyle='rgba(200,200,220,0.9)';ctx.font='10px monospace';
    ctx.fillText(a.desc,W-246,y+38);ctx.restore();
    return a.timer>0;
  });
}

function addDmgNum(x,y,text,color='#FFD700',big=false){
  dmgNums.push({x,y,vy:-2.2-(big?1.5:0),text,color,life:big?75:50,maxLife:big?75:50,big});
}
function drawDmgNums(){
  dmgNums=dmgNums.filter(d=>{
    d.life--;d.y+=d.vy;d.vy*=0.93;
    const a=Math.min(1,d.life/(d.maxLife*0.3))*Math.min(1,d.life/12);
    ctx.save();ctx.globalAlpha=Math.max(0,a);
    const sz=d.big?22+Math.max(0,(d.maxLife-d.life)/d.maxLife*12):14;
    ctx.font=`bold ${sz}px monospace`;
    ctx.textAlign='center';ctx.shadowBlur=d.big?18:8;ctx.shadowColor=d.color;
    ctx.fillStyle=d.color;ctx.fillText(d.text,d.x,d.y);
    ctx.shadowBlur=0;ctx.restore();
    return d.life>0;
  });
}

function addDiamond(x,y,vx,vy,life,color,size){addPt(x,y,vx,vy,life,color,size,'diamond');}
function addSpark(x,y,vx,vy,life,color,size){addPt(x,y,vx,vy,life,color,size,'spark');}

function rand(a,b){return Math.random()*(b-a)+a;}
function lerp(a,b,t){return a+(b-a)*t;}

// ── 投擲物：学長が敵に投げる「小判（こばん）」──
// type: 'small' (キー打鍵時) / 'big' (ワード完了時) / 'critical' (商流拳大判)
function addProj(x,y,color,type){
  type=type||'big';
  if(projs.length>40)return;
  const tx=540+(Math.random()-0.5)*30, ty=200+(Math.random()-0.5)*20;
  // ── サイズ計算：コンボ × 打鍵速度 × WPM ──
  // コンボでサイズUP（コンボ50で約2.75倍）
  const comboBoost=1+Math.min(G.combo,50)*0.035;
  // 打鍵間隔ブースト（連続高速打鍵で巨大化）
  const now=performance.now();
  const interval=G.lastKeyStrokeAt?Math.max(0,now-G.lastKeyStrokeAt):999;
  let speedBoost=1.0;
  if(interval<80) speedBoost=1.65;       // 神速 (WPM150+)
  else if(interval<140) speedBoost=1.40; // 超高速 (WPM85+)
  else if(interval<220) speedBoost=1.20; // 高速
  else if(interval<350) speedBoost=1.08; // 通常
  // WPMブースト（最大1.3倍 at WPM120）
  const wpmBoost=1+Math.min(G.currentWpm||0,120)*0.0025;
  const baseSize=type==='critical'?44:type==='big'?28:16;
  let size=baseSize*comboBoost*speedBoost*wpmBoost;
  // サイズ上限（画面を埋め尽くさない）
  const maxSize=type==='critical'?80:type==='big'?60:42;
  size=Math.min(size,maxSize);
  // コンボ15以上：稀にsmallが「巨大金塊」化（15%確率）
  if(type==='small'&&G.combo>=15&&Math.random()<0.15){
    size=Math.min(maxSize,size*1.35);type='goldbar';color='#ffaa00';
  }
  // 🍠 たまに焼き芋・じゃがいもを投げる（学長の遊び心・smallのみ）
  if(type==='small'&&Math.random()<0.04){
    const isYaki=Math.random()<0.5;
    type=isYaki?'yakiimo':'jagaimo';
    size=Math.max(size,isYaki?22:20);
    color=isYaki?'#d97a2a':'#c4a878';
  }
  const speed=type==='critical'?14:type==='big'?18:30;
  const totalDist=Math.sqrt((tx-x)**2+(ty-y)**2);
  const flightFrames=Math.max(8,totalDist/speed);
  projs.push({
    x0:x,y0:y,x,y,tx,ty,
    color:color||'#FFD700',
    size,type,
    rot:0,rotSpeed:(Math.random()*0.4+0.3)*(Math.random()<0.5?1:-1),
    t:0,maxT:flightFrames,
    arcHeight:type==='critical'?80:type==='big'?55:35,
  });
}
function drawKoban(x,y,r,rot,color){
  // 小判（楕円）を3D風に回転させる（軽量版・shadowBlur削減）
  const sx=Math.abs(Math.cos(rot));
  const scaleX=Math.max(0.25,sx);
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot*0.15);
  ctx.scale(scaleX,1);
  // shadowBlurはbigとcriticalのみ
  const heavy=r>=24;
  if(heavy){ctx.shadowBlur=12;ctx.shadowColor=color;}
  // 単色塗り（グラデーション省略・速い）
  ctx.fillStyle=color;
  ctx.beginPath();ctx.ellipse(0,0,r,r*0.62,0,0,Math.PI*2);ctx.fill();
  if(heavy)ctx.shadowBlur=0;
  // 縁取り
  ctx.strokeStyle='rgba(140,90,0,0.85)';ctx.lineWidth=Math.max(1,r*0.08);
  ctx.beginPath();ctx.ellipse(0,0,r,r*0.62,0,0,Math.PI*2);ctx.stroke();
  // 「金」の文字（heavy時のみ）
  if(heavy&&sx>0.55){
    ctx.fillStyle='#5a3a00';
    ctx.font=`bold ${Math.floor(r*0.85)}px "Hiragino Sans","Yu Gothic",monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('金',0,1);
    ctx.textBaseline='alphabetic';
  }
  ctx.restore();
}
// ── 🍠 焼き芋 ──
function drawYakiimo(x,y,r,rot){
  ctx.save();
  ctx.translate(x,y);ctx.rotate(rot*0.2);
  ctx.shadowBlur=8;ctx.shadowColor='#aa3300';
  // 本体（楕円・両端細い・焦げ茶〜オレンジ）
  const g=ctx.createRadialGradient(0,-r*0.2,r*0.1,0,0,r);
  g.addColorStop(0,'#ffaa55');g.addColorStop(0.6,'#d97a2a');g.addColorStop(1,'#6a3010');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(0,0,r,r*0.42,0,0,Math.PI*2);ctx.fill();
  // 黒い焦げ目
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(60,30,0,0.6)';
  for(let i=0;i<3;i++){
    const sa=i*Math.PI/3+rot*0.1;
    ctx.beginPath();ctx.ellipse(Math.cos(sa)*r*0.4,Math.sin(sa)*r*0.15,r*0.18,r*0.08,0,0,Math.PI*2);ctx.fill();
  }
  // 湯気
  ctx.fillStyle='rgba(255,240,220,0.5)';
  for(let i=0;i<2;i++){
    const sy=-r*0.5-i*r*0.3-Math.abs(Math.sin(rot+i))*4;
    ctx.beginPath();ctx.arc(Math.sin(rot*2+i)*4,sy,r*0.13,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
// ── 🥔 じゃがいも ──
function drawJagaimo(x,y,r,rot){
  ctx.save();
  ctx.translate(x,y);ctx.rotate(rot*0.18);
  ctx.shadowBlur=6;ctx.shadowColor='#664422';
  // ボコボコ形状（楕円ベース）
  const g=ctx.createRadialGradient(-r*0.2,-r*0.2,r*0.1,0,0,r);
  g.addColorStop(0,'#e0c896');g.addColorStop(0.6,'#c4a878');g.addColorStop(1,'#7a5530');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(0,0,r,r*0.7,0,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
  // 芽（黒い点）
  ctx.fillStyle='#3a2a1a';
  for(let i=0;i<4;i++){
    const ang=i*Math.PI/2+0.5;
    const rx=Math.cos(ang)*r*0.55,ry=Math.sin(ang)*r*0.4;
    ctx.beginPath();ctx.arc(rx,ry,1.5,0,Math.PI*2);ctx.fill();
  }
  // テクスチャ（縁）
  ctx.strokeStyle='rgba(90,60,30,0.6)';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,0,r,r*0.7,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
// ── 敵の被弾リアクション（投擲物着弾時にたまに発火） ──
const ENEMY_HIT_REACTIONS=['うっ！','ぐっ…','やめろ！','痛い！','効くわ…','くそっ！','んあぁ','ぐぬぬ','ぎゃっ','効きすぎや…'];
function maybeEnemyReact(x,y){
  if(Math.random()<0.08){
    const line=ENEMY_HIT_REACTIONS[Math.floor(Math.random()*ENEMY_HIT_REACTIONS.length)];
    addDmgNum(x+30,y-20,line,'#ffaaaa',false);
    // TTSも稀に
    if(Math.random()<0.4&&typeof SFX!=='undefined'&&SFX.speak){
      SFX.speak(line,{rate:1.5,pitch:1.3,volume:0.5});
    }
  }
}
function updateDrawProjs(){
  projs=projs.filter(p=>{
    p.t++;
    const r=Math.min(1,p.t/p.maxT);
    // 放物線軌道
    p.x=lerp(p.x0,p.tx,r);
    const baseY=lerp(p.y0,p.ty,r);
    const arc=-Math.sin(r*Math.PI)*p.arcHeight;
    p.y=baseY+arc;
    p.rot+=p.rotSpeed;
    // 着弾判定
    if(r>=1){
      coinBurst(p.tx,p.ty);
      hitBurst(p.tx-20,p.ty+15,p.color);
      maybeEnemyReact(p.tx,p.ty);
      // typeに応じた着弾エフェクト
      if(p.type==='critical'){
        addImpact(p.tx,p.ty,22,'#FFD700');
        for(let i=0;i<8;i++){
          addStar(p.tx,p.ty,Math.cos(i)*4,Math.sin(i)*4-2,40,'#FFD700',6);
        }
      }else if(p.type==='big'){
        addImpact(p.tx,p.ty,10,p.color);
      }
      return false;
    }
    // 軌跡パーティクル（ティルテール・パフォーマンス考慮）
    if(p.type==='small'){
      // smallは軌跡を完全に省略（影だけで存在感は十分）
    }else if(p.type==='big'){
      if(p.t%3===0)addPt(p.x+(Math.random()-0.5)*4,p.y+(Math.random()-0.5)*4,0,0,10,p.color,3);
    }else{
      // criticalのみ豪華に
      if(p.t%2===0)addPt(p.x,p.y,0,0,12,p.color,3);
      if(p.t%4===0){
        const hue=(p.t*15)%360;
        addStar(p.x,p.y,0,0,18,`hsl(${hue},100%,65%)`,4);
      }
    }
    // 描画（タイプ別に切り替え）
    if(p.type==='yakiimo')drawYakiimo(p.x,p.y,p.size,p.rot);
    else if(p.type==='jagaimo')drawJagaimo(p.x,p.y,p.size,p.rot);
    else drawKoban(p.x,p.y,p.size,p.rot,p.color);
    return true;
  });
}
function updatePts(){pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.vx*=0.96;p.life--;return p.life>0;});}
function drawStar5(cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2;const rad=i%2===0?r:r*0.42;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}
  ctx.closePath();ctx.fill();
}
function drawDiamond(cx,cy,r){
  ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx+r*0.6,cy);ctx.lineTo(cx,cy+r);ctx.lineTo(cx-r*0.6,cy);ctx.closePath();ctx.fill();
}
function drawPts(){
  pts.forEach(p=>{
    const a=p.life/p.maxLife;ctx.save();ctx.globalAlpha=a;
    if(p.size>30){
      ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.shadowBlur=8;ctx.shadowColor=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-a)*0.8,0,Math.PI*2);ctx.stroke();
    }else if(p.type==='star'){
      const r=p.size*Math.max(0.2,a);ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.fillStyle=p.color;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate((1-a)*Math.PI*2);ctx.translate(-p.x,-p.y);
      drawStar5(p.x,p.y,r);ctx.restore();
    }else if(p.type==='diamond'){
      const r=p.size*Math.max(0.2,a);ctx.shadowBlur=8;ctx.shadowColor=p.color;ctx.fillStyle=p.color;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate((1-a)*Math.PI);ctx.translate(-p.x,-p.y);
      drawDiamond(p.x,p.y,r);ctx.restore();
    }else if(p.type==='spark'){
      const len=p.size*a*2;const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy)||1;const nx=p.vx/spd,ny=p.vy/spd;

  ctx.fillStyle='#7a3800';ctx.beginPath();ctx.ellipse(-7,-7,4,3.5*blinkScale,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(7,-7,4,3.5*blinkScale,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#100600';ctx.beginPath();ctx.ellipse(-7,-7,2.2,2.8*blinkScale,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(7,-7,2.2,2.8*blinkScale,0,0,Math.PI*2);ctx.fill();

function drawEnemy(x,y,state){
  const st=STAGES[G.stageIdx];
  ctx.save();

  // KO倒れアニメ：SF2リスペクト・スローモ吹っ飛び（enemyKoTimer 180→0）
  if(state==='ko'&&G.enemyKoTimer>0){
    const t=G.enemyKoTimer;
    const progress=Math.min(1,(180-t)/180); // 0→1
    // 段階1（0-0.18）: 衝撃硬直＋首振り
    // 段階2（0.18-0.55）: 上方へ吹っ飛び（放物線）
    // 段階3（0.55-1.0）: 回転落下
    let fallX,fallY,fallRot;
    if(progress<0.18){
      const p=progress/0.18;
      fallX=-Math.sin(p*Math.PI*3)*6;
      fallY=Math.sin(p*Math.PI)*8;
      fallRot=Math.sin(p*Math.PI*4)*0.18;
    }else if(progress<0.55){
      const p=(progress-0.18)/0.37;
      fallX=p*120;
      fallY=-Math.sin(p*Math.PI)*140; // 放物線で上昇
      fallRot=p*Math.PI*1.4;
    }else{
      const p=(progress-0.55)/0.45;
      fallX=120+p*180;
      fallY=-Math.sin((1-p)*Math.PI*0.5)*30+p*p*180;
      fallRot=Math.PI*1.4+p*Math.PI*2.5;
    }
    ctx.translate(x+fallX,y+fallY);ctx.rotate(fallRot);
  } else {
    ctx.translate(x,y);
    // チャージ演出：攻撃前60フレームに前傾み＋グロー
    if(state==='charge'){
      const pulse=Math.sin(G.frameN*0.25)*0.06;
      ctx.rotate(-0.15+pulse);
      ctx.shadowBlur=22+Math.sin(G.frameN*0.2)*8;
      ctx.shadowColor=st.col;
    }
  }

  if(G.stageIdx===0)drawKinoko(0,0,state,STAGES[0].col);
  else if(G.stageIdx===1)drawSagi(0,0,state);
  else if(G.stageIdx===2)drawHoken(0,0,state);
  else if(G.stageIdx===3)drawFP(0,0,state);
  else drawDarkLion(0,0,state);

  // チャージ時：目の発光オーバーレイ
  if(state==='charge'){
    const gAlpha=0.35+Math.sin(G.frameN*0.2)*0.15;
    ctx.shadowBlur=0;ctx.globalAlpha=gAlpha;
    ctx.fillStyle=st.col;ctx.beginPath();ctx.ellipse(-8,-72,7,6,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(8,-72,7,6,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  ctx.restore();
}

// ── 商流拳イントロテロップ（学長ドアップ・画角変更）──
function drawShohouIntro(){
  if(G.shohouIntroTimer<=0)return;
  const t=G.shohouIntroTimer;const maxT=90;
  const age=maxT-t;
  const alpha=t>70?Math.min(1,(maxT-t)/20):t<20?t/20:1;
  ctx.save();ctx.globalAlpha=alpha;
  // ── 1. 暗転（強め）──
  ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,W,H);
  // ── 2. 集中線（放射）──
  const cx=W/2,cy=H/2+10;
  const lineN=42;
  ctx.save();
  for(let i=0;i<lineN;i++){
    const a=(i/lineN)*Math.PI*2+G.frameN*0.012;
    const inR=110+Math.sin(G.frameN*0.08+i)*8;
    const outR=520;
    const hue=20+(i%5)*8;
    ctx.strokeStyle=`hsla(${hue},100%,${55+Math.sin(G.frameN*0.1+i)*10}%,${0.55*alpha})`;
    ctx.lineWidth=2.4+Math.sin(G.frameN*0.2+i)*1.2;
    ctx.shadowBlur=14;ctx.shadowColor='#ff6600';
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*inR,cy+Math.sin(a)*inR);

    ctx.stroke();

let shohouTimer=0;
function drawShohouEffect(){
  if(shohouTimer<=0)return;
  const t=shohouTimer;const maxT=220;
  // フェードイン
  if(t>155){const alpha=Math.min(1,(maxT-t)/65*0.92);ctx.fillStyle=`rgba(0,0,0,${alpha})`;ctx.fillRect(0,0,W,H);}
  // 色フラッシュシーケンス（RGB分離 強化版）
  if(t>158&&t<185){
    const age=185-t;const fl=age/27;
    ctx.save();
    // ドラスティックな色ずれ：R層を右、B層を左に大きくシフト
    ctx.globalAlpha=fl*0.55;ctx.fillStyle='#ff0000';ctx.fillRect(-10,0,W,H);
    ctx.globalAlpha=fl*0.55;ctx.fillStyle='#0000ff';ctx.fillRect(10,0,W,H);
    ctx.globalAlpha=fl*0.35;ctx.fillStyle='#00ff00';ctx.fillRect(0,6,W,H);
    // ノイズライン：走査線ぽい横線
    ctx.globalAlpha=fl*0.2;ctx.fillStyle='#ffffff';
    for(let y=0;y<H;y+=6){ctx.fillRect(0,y,W,1);}
    ctx.restore();
  }
  // 商流発動直後：画面端パルス
  if(t>185&&t<200){
    const fl=(200-t)/15;
    ctx.save();ctx.globalAlpha=fl*0.4;
    const g=ctx.createRadialGradient(W/2,H/2,W*0.1,W/2,H/2,W*0.75);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(255,80,0,1)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
  }
  // 全方位放射線（2層）
  if(t>100&&t<162){
    const cx=W/2,cy=H/2-20;ctx.save();
    const n=48;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2+(G.frameN*0.05);const len=rand(110,280);const alpha=(1-(162-t)/62)*0.72;
      const hue=(i/n)*60+20;
      ctx.strokeStyle=`hsla(${hue},100%,60%,${alpha})`;ctx.lineWidth=1.8;ctx.shadowBlur=16;ctx.shadowColor=`hsl(${hue},100%,50%)`;
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*26,cy+Math.sin(a)*26);ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);ctx.stroke();
    }
    // 内側の密な線
    for(let i=0;i<24;i++){
      const a=(i/24)*Math.PI*2-(G.frameN*0.03);const len=rand(60,140);const alpha=(1-(162-t)/62)*0.45;
      ctx.strokeStyle=`rgba(255,255,200,${alpha})`;ctx.lineWidth=1;ctx.shadowBlur=0;
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*10,cy+Math.sin(a)*10);ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.restore();
  }
  // 商流拳！テキスト（迫力MAX）
  if(t<135&&t>30){
    const sc=t>118?1+(135-t)/17*2.5:1;const alpha=t<45?(t-30)/15:1;
    ctx.save();ctx.globalAlpha=alpha;ctx.translate(W/2,H/2-20);ctx.scale(sc,sc);ctx.textAlign='center';
    // 影レイヤー（ぶれ感）
    for(let i=0;i<3;i++){
      const ox=(Math.random()-0.5)*6,oy=(Math.random()-0.5)*6;
      ctx.shadowBlur=60;ctx.shadowColor='#ff2200';ctx.fillStyle=`rgba(255,${30+i*20},0,0.4)`;
      ctx.font='bold 76px "Hiragino Sans","Yu Gothic",monospace';ctx.fillText('商流拳！！！',ox,oy);
    }
    ctx.shadowBlur=0;
    // グラデーションテキスト本体
    const grad=ctx.createLinearGradient(0,-40,0,40);
    grad.addColorStop(0,'#ffffff');grad.addColorStop(0.25,'#FFD700');grad.addColorStop(0.7,'#ff8800');grad.addColorStop(1,'#ff3300');
    ctx.shadowBlur=40;ctx.shadowColor='#ffcc00';ctx.fillStyle=grad;
    ctx.font='bold 76px "Hiragino Sans","Yu Gothic",monospace';ctx.fillText('商流拳！！！',0,0);ctx.shadowBlur=0;
    if(sc<1.45){
      // 必殺帯
      ctx.fillStyle='rgba(255,150,0,0.22)';ctx.fillRect(-200,46,400,28);
      ctx.fillStyle='rgba(255,220,100,0.95)';ctx.font='bold 14px monospace';ctx.fillText('── 必殺！商流拳！ ──',0,64);
      // 名言
      if(G.shohouWord&&t<110){
        const qAlpha=Math.min(1,(110-t)/30);ctx.globalAlpha=qAlpha;
        ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-230,76,460,32);
        ctx.fillStyle='#FFD700';ctx.font='bold 16px "Hiragino Sans","Yu Gothic",monospace';
        ctx.shadowBlur=12;ctx.shadowColor='#ff8800';ctx.fillText(G.shohouWord.jp,0,97);ctx.shadowBlur=0;
        ctx.globalAlpha=1;
      }
    }
    ctx.restore();
  }
  // 三重衝撃波
  if(t<115&&t>60){
    const age=115-t;
    [1,0.6,0.3].forEach((scale,li)=>{
      const r=age*22*scale;const alpha=Math.max(0,(1-age/55)*scale);
      const colors=['rgba(255,180,0','rgba(255,255,180','rgba(255,100,0'];
      ctx.strokeStyle=`${colors[li]},${alpha})`;ctx.lineWidth=(5-li*1.5)*(1-age/55);
      ctx.shadowBlur=28;ctx.shadowColor='#ff9900';
      ctx.beginPath();ctx.arc(W/2,H/2-20,r,0,Math.PI*2);ctx.stroke();
    });
    ctx.shadowBlur=0;
  }
  // パーティクル大量放出
  if(t%2===0&&t>35&&t<165){
    const cols=['#FFD700','#ff9900','#ffffff','#ffcc44','#ff6600'];
    for(let k=0;k<3;k++){
      const a=Math.random()*Math.PI*2,r=rand(10,180);
      addPt(W/2+Math.cos(a)*r,H/2-20+Math.sin(a)*r,(Math.random()-0.5)*9,(Math.random()-0.5)*9-3,rand(25,55),cols[Math.floor(Math.random()*cols.length)],rand(3,10));
    }
  }
  // ヒット時コインが敵→プレイヤーへ流れる
  if(t===90){for(let i=0;i<5;i++)setTimeout(()=>addProj(rand(500,580),rand(170,230),'#FFD700'),i*60);}
  shohouTimer--;
}

// ── 金持ち山イラスト（クリア画面背景）──
function drawWealthMountain(t){
  // 空グラデ
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a1340');sky.addColorStop(0.45,'#d94f3a');sky.addColorStop(1,'#ffb347');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // 満月＋後光
  const mx=W*0.82,my=H*0.22,mr=38;
  const halo=ctx.createRadialGradient(mx,my,mr*0.4,mx,my,mr*4.5);
  halo.addColorStop(0,'rgba(255,220,150,0.55)');halo.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(mx,my,mr*4.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff2c4';ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fill();
  // 放射状光線
  ctx.save();ctx.translate(mx,my);ctx.globalAlpha=0.12;
  for(let i=0;i<14;i++){
    const a=i*Math.PI/7+t*0.003;
    ctx.fillStyle='#ffe2a0';ctx.beginPath();
    ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*420,Math.sin(a)*420);
    ctx.lineTo(Math.cos(a+0.04)*420,Math.sin(a+0.04)*420);ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
  // 遠景山
  ctx.fillStyle='rgba(90,70,112,0.65)';
  ctx.beginPath();ctx.moveTo(0,H*0.55);
  ctx.lineTo(W*0.18,H*0.42);ctx.lineTo(W*0.35,H*0.50);
  ctx.lineTo(W*0.55,H*0.38);ctx.lineTo(W*0.78,H*0.48);
  ctx.lineTo(W,H*0.44);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  // 主役山
  const peakX=W/2,peakY=H*0.28,baseY=H*0.92,baseHalf=W*0.55;
  ctx.strokeStyle='#ff8a3d';ctx.lineWidth=3.5;ctx.shadowBlur=14;ctx.shadowColor='#ff8a3d';
  ctx.beginPath();ctx.moveTo(peakX-baseHalf,baseY);ctx.lineTo(peakX,peakY);ctx.lineTo(peakX+baseHalf,baseY);ctx.stroke();
  ctx.shadowBlur=0;
  const mg=ctx.createLinearGradient(0,peakY,0,baseY);
  mg.addColorStop(0,'#2a1f3d');mg.addColorStop(1,'#0e0818');
  ctx.fillStyle=mg;
  ctx.beginPath();ctx.moveTo(peakX-baseHalf,baseY);ctx.lineTo(peakX,peakY);ctx.lineTo(peakX+baseHalf,baseY);ctx.closePath();ctx.fill();
  // 冠雪
  ctx.fillStyle='#fff8e7';
  ctx.beginPath();ctx.moveTo(peakX,peakY);
  ctx.lineTo(peakX-46,peakY+62);ctx.lineTo(peakX-32,peakY+52);ctx.lineTo(peakX-18,peakY+70);
  ctx.lineTo(peakX-4,peakY+58);ctx.lineTo(peakX+10,peakY+72);ctx.lineTo(peakX+26,peakY+56);
  ctx.lineTo(peakX+42,peakY+68);ctx.lineTo(peakX+50,peakY+60);ctx.closePath();ctx.fill();
  // 雲海
  const cloudY=H*0.62+Math.sin(t*0.01)*2;
  for(let i=0;i<6;i++){
    const cx=((i*180+t*0.4)%(W+200))-100;
    const ca=0.55-Math.abs(i-2.5)*0.06;
    ctx.fillStyle=`rgba(255,244,220,${ca})`;
    ctx.beginPath();ctx.ellipse(cx,cloudY+Math.sin(i)*4,90,14,0,0,Math.PI*2);ctx.fill();
  }
  // チェックポイント旗
  const flags=[
    {x:peakX-150,y:baseY-70, label:'100万', col:'#c8102e'},
    {x:peakX+120,y:baseY-130,label:'300万', col:'#c8102e'},
    {x:peakX-90, y:baseY-180,label:'500万', col:'#c8102e'},
    {x:peakX+70, y:baseY-235,label:'1000万',col:'#e8732a'},
    {x:peakX-40, y:baseY-290,label:'3000万',col:'#ffa500'},
  ];
  flags.forEach((f,i)=>{
    const wave=Math.sin(t*0.08+i)*2;
    ctx.strokeStyle='#3a2a1a';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x,f.y-22);ctx.stroke();
    ctx.fillStyle=f.col;
    ctx.beginPath();ctx.moveTo(f.x,f.y-22);ctx.lineTo(f.x+18+wave,f.y-18);ctx.lineTo(f.x,f.y-12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 8px "Hiragino Sans","Yu Gothic",monospace';ctx.textAlign='left';
    ctx.fillText(f.label,f.x+2,f.y-14);
  });
  // 頂上「5000万」旗
  const gWave=Math.sin(t*0.1)*3;
  ctx.strokeStyle='#3a2a1a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(peakX,peakY-2);ctx.lineTo(peakX,peakY-38);ctx.stroke();
  ctx.fillStyle='#ffd700';ctx.shadowBlur=14;ctx.shadowColor='#ffd700';
  ctx.beginPath();ctx.moveTo(peakX,peakY-38);ctx.lineTo(peakX+28+gWave,peakY-32);ctx.lineTo(peakX,peakY-22);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#3a2a1a';ctx.font='bold 9px "Hiragino Sans","Yu Gothic",monospace';
  ctx.fillText('5000万',peakX+3,peakY-28);
  ctx.textAlign='center';
  // シルエット登山者
  const climbers=[{x:peakX-200,y:baseY-50},{x:peakX+180,y:baseY-95},{x:peakX-60,y:baseY-145}];
  ctx.fillStyle='#000';
  climbers.forEach(c=>{
    ctx.beginPath();ctx.arc(c.x,c.y-6,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillRect(c.x-2,c.y-4,4,7);
  });
  // 金貨パーティクル
  for(let i=0;i<24;i++){
    const px=(i*73+t*0.6)%W;
    const py=((i*131+t*1.4)%(H+40))-20;
    const sc=Math.abs(Math.cos(t*0.05+i));
    ctx.fillStyle='#ffcc33';ctx.strokeStyle='#b8860b';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.ellipse(px,py,5*sc+1,5,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  // テキスト視認帯
  const veil=ctx.createLinearGradient(0,H*0.35,0,H*0.78);
  veil.addColorStop(0,'rgba(0,0,0,0)');veil.addColorStop(0.5,'rgba(0,0,0,0.45)');veil.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=veil;ctx.fillRect(0,H*0.35,W,H*0.43);
}
// ── 3段階リザルト判定 ──
function getResultRank(){
  const score=G.score;
  // 難易度補正
  // 難易度補正：HARDは敵HP1.5倍でスコア出にくいので逆転（QA-D修正）
  const diffMul={easy:0.7,normal:1.0,hard:1.4}[selectedDiff]||1.0;
  const adjusted=score*diffMul;
  if(adjusted>=80000)return {rank:'FIRE',label:'🔥 FIRE達成',col:'#FFD700',glow:'#ff9900',sub:'経済的自由を完全制覇！',great:true};
  if(adjusted>=40000)return {rank:'KOGANE',label:'💰 小金持ち',col:'#88ff88',glow:'#00cc66',sub:'お金持ち街道の途中！',great:false};
  return {rank:'SEED',label:'🌱 種銭未満',col:'#88aaff',glow:'#5577cc',sub:'もう一度チャレンジしよう！',great:false};
}

function getActiveContinueProfile(){
  const conf=CONTINUE_CONFIG[selectedDiff]||CONTINUE_CONFIG.easy;
  if(selectedDiff==='hard'){
    const g=HARD_GIMMICKS[Math.min(G.continuesUsed,HARD_GIMMICKS.length-1)];
    return {...conf,
      theme:g.name,themeIcon:g.icon,themeCol:g.col,themeGlow:g.col,
      quote:g.quote,sub:g.sub,
      hpRestore:Math.min(1.0,conf.hpRestore*g.hpMul),
      costRate:conf.costRate*g.costMul,
      btnLabel:`${g.icon} ${g.name}で継続`,
      speakText:g.speak,
      _gimmick:g,
    };
  }
  return conf;
}
function applyContinue(){
  const conf=getActiveContinueProfile();
  G.score=Math.max(0,G.score-G.continueCost);
  G.continuesUsed++;
  G.playerHp=Math.floor(G.playerMaxHp*conf.hpRestore);
  G.playerHurt=0;
  G.combo=0;G.comboTimer=0;
  G.atkTimer=Math.max(G.atkTimer,180);
  G.phase='resuming';G.resumeCountdown=180;
  startBGM();SFX.shohouImpact();
  flash(conf.themeCol,0.7);playerDamageVignette=30;
  unlockAchievement(conf.achievement);
  if(SFX&&SFX.speak)SFX.speak(conf.speakText,{rate:1.05,pitch:0.8,volume:0.85});
  // 10回目（最後の切り札）使用時の特別演出
  if(selectedDiff==='hard'&&G.continuesUsed===10){
    setTimeout(()=>{
      flash('#FFD700',0.9);
      for(let i=0;i<24;i++)setTimeout(()=>coinBurst(rand(W*0.2,W*0.8),rand(H*0.2,H*0.7)),i*40);
    },200);
  }
}
function declineContinue(){
  const conf=CONTINUE_CONFIG[selectedDiff]||CONTINUE_CONFIG.easy;

  unlockAchievement(conf.declineAch);

// ── メインループ ──
function loop(){
  G.frameN++;updateFX();
  ctx.save();
  if(Math.abs(zoomScale-1)>0.002){ctx.translate(zoomCX,zoomCY);ctx.scale(zoomScale,zoomScale);ctx.translate(-zoomCX,-zoomCY);}
  if(shakePow>0.3)ctx.translate(Math.round(shakeX),Math.round(shakeY));

  if(G.phase==='disclaimer'){
    drawDisclaimer();
  }
  else if(G.phase==='modeselect'){
    drawModeSelect();
  }
  else if(G.phase==='title'){
    drawTitle();drawPts();updatePts();
    if(Math.random()<0.015)coinBurst(Math.random()*W,Math.random()*H*0.5);
  }
  else if(G.phase==='fight'){
    if(G.hitstop>0){G.hitstop--;}
    else if(G.shohouIntroTimer>0){
      G.shohouIntroTimer--;
      // 予兆SE：イントロ残り60フレで一度だけ発火
      if(G.shohouIntroTimer===60)SFX.shohouCharge();
      if(G.wrongFlash>0)G.wrongFlash--;
      if(G.playerHurt>0)G.playerHurt--;if(G.enemyHurt>0)G.enemyHurt--;if(G.playerAtk>0)G.playerAtk--;
      if(G.shohouIntroTimer<=0){
        startShohouMode();shohouTimer=200;SFX.shohou();flash('#ff6600',0.85);startShohouBGM();
        // 商流拳前口上（shohouWordIdxに対応した名言）
        const introLine=SHOHOU_INTRO_LINES[shohouWordIdx%SHOHOU_INTRO_LINES.length];
        if(introLine)showLionQuote(introLine,{duration:160,col:'#fff',bg:'rgba(60,20,0,0.95)'});
        unlockAchievement('shohou_used');shohouCount++;if(shohouCount>=3)unlockAchievement('shohou3');
      }
    }
    else{
      G.atkTimer--;
      if(G.atkTimer<=0){
        const st=STAGES[G.stageIdx];
        // 敵ラッシュモード：HP30%以下で攻撃間隔×0.78（商流拳中は通常戻し）
        const inRush=G.rushActive&&G.shohouIntroTimer<=0&&!G.isShohouMode&&shohouTimer<=0;
        G.atkTimer=Math.floor(st.atkInterval*(inRush?0.78:1.0));
        G.playerHp=Math.max(0,G.playerHp-st.enemyAtk);
        G.playerHurt=20;G.stageNoDamage=false;
        // ラッシュ中なら被弾を強化（攻撃力UPの体感）
        const inRushFx=G.rushActive&&G.shohouIntroTimer<=0&&!G.isShohouMode;
        const rush=ENEMY_RUSH[G.stageIdx];
        if(inRushFx){
          shake(22);SFX.enemyAtk();
          // ラッシュ専用の派手な被弾
          wrongBurst(178,202);wrongBurst(178,180);wrongBurst(200,210);
          playerDamageVignette=66;
          addDmgNum(178,160,'大被弾！','#ff0033',true);
          if(rush)addDmgNum(178,140,`${rush.icon} ${rush.name}！`,rush.col,false);
          // ラッシュ専用効果音（金属＋詠唱）
          if(SFX&&SFX.missCounterAtk)SFX.missCounterAtk();
          flash(rush?rush.col:'#ff0033',0.55);
          // 多重ヒット表現：プレイヤー追加ダメージ（過剰防止のため軽め）
          G.playerHp=Math.max(0,G.playerHp-Math.floor(st.enemyAtk*0.12));
        }else{
          shake(14);SFX.enemyAtk();wrongBurst(178,202);
          playerDamageVignette=42;addDmgNum(178,168,'被弾！','#ff3366',true);
        }
        if(G.playerHp<=0){
          // 🌟 奇跡の復活演出（稀に発火・全難易度）
          if(!G.miracleRevivalUsed&&Math.random()<0.12){
            G.miracleRevivalUsed=true;
            G.playerHp=Math.floor(G.playerMaxHp*0.5);
            G.playerHurt=0;
            G.atkTimer=Math.max(G.atkTimer,240);
            flash('#FFD700',1.0);
            if(SFX&&SFX.koCry)SFX.koCry(0);
            if(SFX&&SFX.speak)SFX.speak('まだまだいける！立ち上がれ！',{rate:1.1,pitch:1.0,volume:1.0});
            addDmgNum(W/2,H/2-50,'⭐ 奇跡の復活！','#FFD700',true);
            setTimeout(()=>addDmgNum(W/2,H/2-20,'今日が人生で一番若い日や！','#ffee88',false),200);
            for(let i=0;i<20;i++)setTimeout(()=>coinBurst(rand(W*0.2,W*0.8),rand(H*0.2,H*0.6)),i*60);
            unlockAchievement('miracle');
            // ※ return を削除（loop末端のctx.restore+requestAnimationFrameをスキップしてフリーズしていた）
          }else{
            const conf=CONTINUE_CONFIG[selectedDiff];
            let continueCost=Math.max(conf.minCost,Math.floor(G.score*conf.costRate));
            if(conf&&G.score<continueCost&&G.continuesUsed<conf.maxContinues){
              continueCost=Math.max(0,Math.floor(G.score*0.5));
            }
            if(conf&&G.continuesUsed<conf.maxContinues){
              G.phase='continueprompt';G.continueCost=continueCost;
              stopBGM();SFX.gaugeFull();
            }else{
              G.phase='gameover';stopBGM();saveHS(G.score,G.comboMax);startChip('gameover');
            }
          }
        }
      }
      if(G.comboTimer>0)G.comboTimer--;else if(G.combo>0)G.combo=0;
      // 敵ラッシュ発動チェック：HP30%以下で初回発動（商流拳中は発動しない）
      if(!G.rushActive&&G.enemyHp>0&&G.enemyHp/G.enemyMaxHp<0.30
         &&G.shohouIntroTimer<=0&&!G.isShohouMode&&shohouTimer<=0){
        G.rushActive=true;
        G.rushTeloperTimer=140;
        G.rushAnnouncedStage=G.stageIdx;
        const rush=ENEMY_RUSH[G.stageIdx];
        if(rush){
          // ラッシュ発動SE（金属＋叫び）
          SFX.shohouCharge&&SFX.shohouCharge();
          if(SFX&&SFX.speak)SFX.speak(rush.quote,{rate:1.3,pitch:1.2,volume:0.8});
          flash(rush.col,0.7);
        }
      }
      if(G.wrongFlash>0)G.wrongFlash--;
      if(G.playerHurt>0)G.playerHurt--;if(G.enemyHurt>0)G.enemyHurt--;if(G.playerAtk>0)G.playerAtk--;
      const targetPitch=G.combo>=15?1.2:G.combo>=10?1.12:G.combo>=5?1.06:1.0;
      setBGMPitch(targetPitch);
    }
    updatePts();drawBG();drawPts();updateDrawProjs();drawRipples();drawDmgNums();
    if(G.enemyKoTimer>0)G.enemyKoTimer--;
    // プレイヤー：ノックバックX＋被ダメフィルター
    const hurtX=G.playerHurt>0?Math.sin(G.playerHurt*0.5)*-14:0;
    const lionState=G.playerAtk>0?'atk':G.playerHurt>0?'hurt':'idle';
    if(G.playerHurt>0&&Math.floor(G.playerHurt/3)%2===0){ctx.save();ctx.filter='brightness(3) sepia(1) hue-rotate(180deg)';drawLion(178+hurtX,222,lionState);ctx.restore();}
    else drawLion(178+hurtX,222,lionState);
    // 敵：チャージ判定・シェイク・KO
    if(enemyTypingShake>0){enemyTypingShake--;}
    const esx=enemyTypingShake>0?(Math.random()-0.5)*4:0;
    const enemyAlive=G.enemyHp>0;
    const enemyState=!enemyAlive?'ko':G.enemyHurt>0?'hurt':G.atkTimer<80?'charge':'idle';
    if(G.enemyHurt>0&&Math.floor(G.enemyHurt/3)%2===0){ctx.save();ctx.filter='brightness(3) saturate(0)';ctx.translate(esx,0);drawEnemy(542,222,enemyState);ctx.restore();}
    else{ctx.translate(esx,0);drawEnemy(542,222,enemyState);ctx.translate(-esx,0);}
    drawImpactLines();drawEnemyHitFlash(542,222);
    drawHUD();drawWordPanel();drawEnemyChargeWarn();drawShohouIntro();drawShohouEffect();
    drawLionQuote();checkLionHurtQuote();
    if(flashA>0.01){ctx.globalAlpha=flashA;ctx.fillStyle=flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
    drawLowHpVignette();drawDamageVignette();drawEnemyRush();drawRainbowOverlay();
    drawAchievements();drawCenterBadgePop();drawNonOfficialBadge();
  }
  else if(G.phase==='paused'){drawBG();drawLion(178,222,'idle');drawEnemy(542,222,'idle');drawHUD();drawWordPanel();drawPause();drawAchievements();drawCenterBadgePop();drawNonOfficialBadge();}
  else if(G.phase==='stageintro'){
    drawBG();drawLion(178,222,'idle');drawEnemy(542,222,'idle');drawHUD();drawNonOfficialBadge();
    G.stageIntroTimer--;
    if(G.stageIntroTimer<=0){
      G.phase='fight';

      if(SFX&&SFX.speak)SFX.speak('ファイト！',{rate:1.4,pitch:1.4,volume:0.95});

    }
    else{
      const t=G.stageIntroTimer;const alpha=t>120?Math.min(1,(150-t)/30):t<40?t/40:1;
      const st=STAGES[G.stageIdx];
      ctx.save();ctx.globalAlpha=alpha*0.92;
      // 大きめパネル（敵バイオ+挑発セリフ用に拡張）

      ctx.strokeStyle=st.col;ctx.lineWidth=2;ctx.shadowBlur=14;ctx.shadowColor=st.col;
      ctx.beginPath();ctx.roundRect(W/2-280,H/2-90,560,180,14);ctx.stroke();ctx.shadowBlur=0;
      ctx.globalAlpha=alpha;

      ctx.shadowBlur=10;ctx.shadowColor=st.col;

      const bio=ENEMY_BIOS[G.stageIdx];

  }
  else if(G.phase==='resuming'){

  else if(G.phase==='stageclear'){

  else if(G.phase==='gameclear'){

  ctx.restore();

// ── キー入力 ──
function handleKey(key,code){
  AC.resume();
  // スマホフリック：ワードクリア完了シグナル
  if(code==='__flickcomplete__'){
    const word=G.isShohouMode?G.shohouWord:G.currentWord;
    if(word)processWordComplete(word);
    return;
  }
  if(code==='Escape'){
    if(G.phase==='fight'){G.phase='paused';stopBGM();}
    else if(G.phase==='paused'){G.phase='resuming';G.resumeCountdown=180;startBGM();}
    return;
  }
  if(code==='Enter'){
    if(G.phase==='disclaimer'){G.phase='modeselect';return;}
    if(G.phase==='modeselect'){G.phase='title';startChip('title');return;}
    if(G.phase==='title'){stopChip();shohouWordIdx=0;shohouCount=0;G.continuesUsed=0;startStage(0);}
    else if(G.phase==='stageclear'){
      if(G.stageIdx<STAGES.length-1){stopChip();startStage(G.stageIdx+1);}
      else{stopChip();G.phase='gameclear';SFX.clear();saveHS(G.score,G.comboMax);unlockAchievement('allclear');checkDailyChallenge();setTimeout(()=>startChip('clear'),800);}
    }
    else if(G.phase==='gameclear'||G.phase==='gameover'){stopChip();G.playerHp=G.playerMaxHp;G.score=0;G.comboMax=0;G.continuesUsed=0;G.phase='title';startChip('title');}
    return;
  }
  // Continue画面: Y=継続 / N or Escape=諦める
  if(G.phase==='continueprompt'){
    if(key==='y'||code==='KeyY'){applyContinue();return;}
    if(key==='n'||code==='KeyN'||code==='Escape'){declineContinue();return;}
    return;
  }
  // ハイスコア時 R キーで即リスタート（パクリ#2）
  if(code==='KeyR'&&(G.phase==='gameover'||G.phase==='gameclear')){
    stopChip();stopBGM();
    G.playerHp=G.playerMaxHp;G.score=0;G.comboMax=0;G.continuesUsed=0;
    shohouWordIdx=0;shohouCount=0;
    startStage(G.stageIdx);return;
  }
  if(G.phase==='title'){
    const idx=DIFF_OPTS.indexOf(selectedDiff);
    if(code==='ArrowRight'){selectedDiff=DIFF_OPTS[(idx+1)%DIFF_OPTS.length];SFX.diffChange(selectedDiff);return;}
    if(code==='ArrowLeft'){selectedDiff=DIFF_OPTS[(idx+DIFF_OPTS.length-1)%DIFF_OPTS.length];SFX.diffChange(selectedDiff);return;}
  }
  if(G.phase!=='fight')return;
  if(G.hitstop>0||G.shohouIntroTimer>0)return;
  const word=G.isShohouMode?G.shohouWord:G.currentWord;
  if(!word)return;
  if(code==='Backspace'){if(G.typedIndex>0){G.typedIndex--;G.combo=0;G.comboTimer=0;G.wrongFlash=4;}return;}
  if(key.length!==1||!/[a-z0-9\-\/\.,_]/.test(key))return;
  const expected=word.word[G.typedIndex];
  if(key===expected){
    G.typedIndex++;
    SFX.correct(G.typedIndex-1,word.word.length);
    // 1キーごとに実ダメージ（速度ブースト適用）
    const baseDmg=Math.max(1,Math.floor(word.dmg/word.word.length));
    const sb=calcSpeedDmgMul();
    const keyDmg=Math.max(1,Math.floor(baseDmg*sb.mul));
    G.enemyHp=Math.max(0,G.enemyHp-keyDmg);
    G.enemyHurt=Math.max(G.enemyHurt,5);
    enemyTypingShake=3;
    addDmgNum(rand(510,575),rand(175,240),`-${keyDmg}`,sb.col,sb.mul>=1.8);
    if(sb.tag)addDmgNum(rand(490,560),155,sb.tag,sb.col,false);
    onKeyHit();
    G.lastKeyStrokeAt=performance.now();
    // 毎キー：学長が小判を1枚投擲
    addProj(220,200,'#FFD700','small');
    if(G.typedIndex>=word.word.length){
      processWordComplete(word);
    }
  }else{
    G.wrongFlash=14;G.combo=0;G.comboTimer=0;G.wordMissCount++;G.perfectStreak=0;shake(6);SFX.wrong();wrongBurst(W/2,H-90);
  }
}
function processWordComplete(word){
  const elapsed=(performance.now()-G.wordStartTime)/1000;
  const wpm=Math.round((word.word.length/5)/(elapsed/60));
  G.wpmHistory.push(wpm);if(G.wpmHistory.length>10)G.wpmHistory.shift();
  G.currentWpm=Math.round(G.wpmHistory.reduce((a,b)=>a+b,0)/G.wpmHistory.length);
  if(G.currentWpm>=60)unlockAchievement('wpm60');
  if(G.currentWpm>=80)unlockAchievement('wpm80');
  if(G.currentWpm>=100)unlockAchievement('wpm100');
  const comboBonus=Math.min(G.combo,20)*3;
  const perKeyDealt=Math.floor(word.dmg/word.word.length)*word.word.length;
  const finishBonus=word.dmg-perKeyDealt+comboBonus;
  let dmg=Math.max(finishBonus,comboBonus+5);
  const isShohouFinish=G.isShohouMode;
  if(G.isShohouMode){
    dmg=Math.max(Math.floor(G.enemyMaxHp*0.62),G.enemyHp-1);
    G.isShohouMode=false;G.shohouWord=null;G.superGauge=0;G.superActive=0;
    stopShohouBGM();
    // 商流拳発動：まず学長にドアップ、その後敵へカメラパン
    zoomTargetScale=2.2;zoomCX=178;zoomCY=210;
    setTimeout(()=>{zoomTargetScale=1.6;zoomCX=540;zoomCY=200;},520);
    setTimeout(()=>zoomTargetScale=1.0,1800);
    flash('#ff8800',1.0);superBurst(540,200);
    enemyTypingShake=24;G.enemyHurt=Math.max(G.enemyHurt,40);
    SFX.shohouImpact();
    hpLerpSpeed=0.45;hpBarFlash=30;
  }
  G.enemyHp=Math.max(0,G.enemyHp-dmg);G.score+=dmg*10*(1+G.combo*0.1|0);
  if(isShohouFinish){
    addDmgNum(542,155,'CRITICAL!!','#ffffff',true);
    addDmgNum(542,188,`-${dmg}`,'#FFD700',true);
    setTimeout(()=>addDmgNum(542,220,'商流拳！！','#ff9900',true),160);
  }else{
    addDmgNum(rand(510,575),rand(160,200),`-${dmg}`,'#ff6600',true);
  }
  G.combo++;G.comboTimer=120;G.comboMax=Math.max(G.comboMax,G.combo);
  G.playerAtk=20;G.enemyHurt=22;G.hitstop=8;
  flash('#FFD700',0.32);SFX.wordClear();
  enemyTypingShake=Math.max(enemyTypingShake,14);
  // PERFECT WORD判定（ミス0でクリア）
  if(G.wordMissCount===0&&!isShohouFinish){
    G.perfectStreak++;G.perfectTotal++;
    const bonus=500+(G.perfectStreak>=3?G.perfectStreak*100:0);
    G.score+=bonus;
    addDmgNum(W/2,H/2-30,`PERFECT! +${bonus}`,'#00ffff',true);
    if(G.perfectStreak>=3)addDmgNum(W/2,H/2-58,`${G.perfectStreak} PERFECT 連続！`,'#88ffff',false);
    // 軽量SE
    if(SFX&&SFX.combo5)SFX.combo5();
    if(G.perfectStreak>=5){
      flash('#00ffff',0.4);
      unlockAchievement('perfect5');
    }
  }
  triggerEnemyHitFlash();
  addImpact(542,200,14,'#FFD700');
  wordClearBurst(word.word,W/2,H-110);
  hpBarFlash=Math.max(hpBarFlash,12);hpLerpSpeed=Math.max(hpLerpSpeed,0.22);
  // ワード完成：大判を投擲（商流拳時は虹色クリティカル大判）
  addProj(220,185,isShohouFinish?'#ffaa00':'#FFD700',isShohouFinish?'critical':'big');
  if(isShohouFinish){
    // 商流拳：複数の大判を時間差で投げる
    for(let i=1;i<=3;i++)setTimeout(()=>addProj(220,185+(Math.random()-0.5)*30,'#ffcc00','big'),i*80);
  }
  if(G.combo===5){SFX.combo5();}
  if(G.combo===10){
    SFX.combo10();comboBurst(W/2,H/2,10);unlockAchievement('combo10');
    const lines=LION_COMBO_LINES[10];showLionQuote(lines[Math.floor(Math.random()*lines.length)]);
  }
  if(G.combo===20){SFX.combo20();comboBurst(W/2,H/2,20);flash('#88ffaa',0.5);unlockAchievement('combo20');}
  if(G.combo===30){
    SFX.combo30();comboBurst(W/2,H/2,30);flash('#FFD700',0.6);unlockAchievement('combo30');
    const lines=LION_COMBO_LINES[30];showLionQuote(lines[Math.floor(Math.random()*lines.length)]);
  }
  if(G.combo===50){
    SFX.combo50();comboBurst(W/2,H/2,50);flash('#ffffff',0.8);unlockAchievement('combo50');
    const lines=LION_COMBO_LINES[50];showLionQuote(lines[Math.floor(Math.random()*lines.length)]);
  }
  if(G.combo===100){SFX.combo100();comboBurst(W/2,H/2,100);flash('#ff66ff',1.0);rainbowOverlayTimer=120;}
  checkDailyChallenge();
  const prevGauge=G.superGauge;
  G.superGauge=Math.min(100,G.superGauge+10+Math.min(G.combo,8)*3);
  if(prevGauge<100&&G.superGauge>=100){SFX.gaugeFull();G.shohouIntroTimer=90;}
  if(G.enemyHp<=0){
    G.currentWord=null;G.shohouWord=null;G.isShohouMode=false;
    stopShohouBGM();
    SFX.ko();flash('#FFD700',0.92);
    enemyTypingShake=40;
    // SF2リスペクト・大KO演出
    G.enemyKoTimer=180;            // 90→180（3秒のスローモ吹っ飛び）
    G.hitstop=30;                  // 大ヒットストップで「決まった！」感
    zoomTargetScale=1.85;zoomCX=540;zoomCY=200; // 敵をクローズアップ
    setTimeout(()=>zoomTargetScale=1.0,1600);
    // 「うーお！」3連呼（自前合成）
    SFX.koCry(0);addDmgNum(540,170,'うーお！','#fff',true);
    setTimeout(()=>{SFX.koCry(1);addDmgNum(620,160,'うーお！','#ffaa00',true);},340);
    setTimeout(()=>{SFX.koCry(2);addDmgNum(700,150,'うーお！','#ff6600',true);},680);
    // 捨て台詞TTS（敵がやられ際に喋る）
    setTimeout(()=>{
      const lines=ENEMY_LINES[G.stageIdx]||[];
      if(lines.length>0){
        const line=lines[Math.floor(Math.random()*lines.length)];
        SFX.speak(line,{rate:1.0,pitch:0.75,volume:0.85});
      }
    },1150);
    unlockAchievement('first_kill');
    if(G.stageNoDamage)unlockAchievement('nodamage');
    for(let i=0;i<32;i++)setTimeout(()=>coinBurst(Math.random()*W,Math.random()*H*0.5),i*55);
    setBGMPitch(1.0);stopBGM();
    setTimeout(()=>{G.phase='stageclear';SFX.stageClear();startChip('clear');},2700);
  }else{nextWord();}
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&G.phase==='fight')e.preventDefault();
  handleKey(e.key.toLowerCase(),e.code);
});
const mobileInput=document.getElementById('mobileInput');
let composing=false;
let flickLastLen=0;
function resetFlickInput(){mobileInput.value='';flickLastLen=0;}
mobileInput.addEventListener('compositionstart',()=>{composing=true;});
mobileInput.addEventListener('compositionend',e=>{composing=false;});
mobileInput.addEventListener('input',e=>{
  if(inputMode==='smartphone'){
    if(G.stageIdx===0&&!G.isShohouMode){
      // 1面のみ：ひらがなフリック（商流拳はローマ字入力）
      AC.resume();
      const val=mobileInput.value;
      if(val.length>flickLastLen){
        const newChars=[...val.slice(flickLastLen)].filter(ch=>/[\u3041-\u3096\u30A1-\u30F6ー]/.test(ch));
        flickLastLen=val.length;
        newChars.forEach(ch=>processFlickChar(ch));
      }else{flickLastLen=val.length;}
      return;
    }
    // 2面以降：アルファベット value追跡（フリック式）
    if(composing)return;
    AC.resume();
    const val=mobileInput.value;
    if(val.length>flickLastLen){
      const newChars=val.slice(flickLastLen).toLowerCase();
      flickLastLen=val.length;
      [...newChars].forEach(ch=>{if(/[a-z0-9_]/.test(ch))handleKey(ch,'Key'+ch.toUpperCase());});
    }else{flickLastLen=val.length;}
    return;
  }
  // PC mode: document.keydown 側で処理するのでここでは何もしない
  // （以前は両方発火して 'cc' や 'aa' 等の連続文字が二重入力になっていた）
  mobileInput.value='';
  return;
});
mobileInput.addEventListener('keydown',e=>{
  if(e.key==='Backspace'||e.key==='Enter'){e.stopPropagation();AC.resume();handleKey(e.key.toLowerCase(),e.code||e.key);}
});

function processFlickChar(ch){
  if(G.phase!=='fight'||G.hitstop>0)return;
  const word=G.isShohouMode?G.shohouWord:G.currentWord;
  if(!word)return;
  const expected=word.word[G.flickTyped.length];
  if(ch===expected){
    G.flickTyped+=ch;
    SFX.correct(G.flickTyped.length-1,word.word.length);
    const baseDmg=Math.max(1,Math.floor(word.dmg/word.word.length));
    const sb=calcSpeedDmgMul();
    const keyDmg=Math.max(1,Math.floor(baseDmg*sb.mul));
    G.enemyHp=Math.max(0,G.enemyHp-keyDmg);
    G.enemyHurt=Math.max(G.enemyHurt,5);
    enemyTypingShake=3;
    addDmgNum(rand(510,575),rand(175,240),`-${keyDmg}`,sb.col,sb.mul>=1.8);
    if(sb.tag)addDmgNum(rand(490,560),155,sb.tag,sb.col,false);
    onKeyHit();
    G.lastKeyStrokeAt=performance.now();
    addProj(220,200,'#FFD700','small');
    if(G.flickTyped===word.word){
      G.typedIndex=word.word.length;
      processWordComplete(word);
    }
  }else{
    G.flickTyped='';
    G.wrongFlash=14;G.combo=0;G.comboTimer=0;G.wordMissCount++;G.perfectStreak=0;shake(5);SFX.wrong();wrongBurst(W/2,H-90);
  }
}
cvs.addEventListener('click',e=>{
  AC.resume();mobileInput.focus();
  // Continueプロンプトのクリック判定
  if(G.phase==='continueprompt'){
    const rect=cvs.getBoundingClientRect();const scaleX=W/rect.width,scaleY=H/rect.height;
    const mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleY;
    const btnW=240,btnH=44,gap=24,btnY=H-90;
    const totalBtnW=btnW*2+gap;
    const bx1=W/2-totalBtnW/2;const bx2=bx1+btnW+gap;
    if(my>=btnY&&my<=btnY+btnH){
      if(mx>=bx1&&mx<=bx1+btnW){applyContinue();return;}
      if(mx>=bx2&&mx<=bx2+btnW){declineContinue();return;}
    }
    return;
  }
  if(G.phase==='disclaimer'){
    ['強い者との戦い.mp3','ゲームクリアー！.mp3','悲壮.mp3','Escort.mp3','Thunderbolt.mp3'].forEach(f=>{
      const a=new Audio(f);a.volume=0;a.play().then(()=>a.pause()).catch(()=>{});
    });
    G.phase='modeselect';return;
  }
  if(G.phase==='modeselect'){
    const rect=cvs.getBoundingClientRect();const scaleX=W/rect.width,scaleY=H/rect.height;
    const mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleY;
    const bw=260,bx=W/2-bw/2;
    const pcY=H/2-28,spY=H/2+44,bh=52;
    if(mx>=bx&&mx<=bx+bw&&my>=pcY&&my<=pcY+bh){inputMode='pc';resize();G.phase='title';startChip('title');return;}
    if(mx>=bx&&mx<=bx+bw&&my>=spY&&my<=spY+bh){inputMode='smartphone';resize();G.phase='title';startChip('title');return;}
    return;
  }
  if(G.phase==='title'){
    const rect=cvs.getBoundingClientRect();const scaleX=W/rect.width,scaleY=H/rect.height;
    const mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleY;
    const btnW=92,btnH=30,btnY=H/2+66,gap=12;const totalBtnW=DIFF_OPTS.length*(btnW+gap)-gap;
    let clicked=false;
    DIFF_OPTS.forEach((d,i)=>{const bx=W/2-totalBtnW/2+i*(btnW+gap);if(mx>=bx&&mx<=bx+btnW&&my>=btnY&&my<=btnY+btnH){selectedDiff=d;SFX.diffChange(d);clicked=true;}});
    if(!clicked){SFX.uiSelect();shohouWordIdx=0;shohouCount=0;startStage(0);}
  }
});

// タイトル画面チップチューンを起動
startChip('title');
loop();
</script>
